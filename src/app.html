<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WedryTrack">
<title>WedryTrack 1.0</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --blue:#0b4f8a; --blue2:#1767ad; --ink:#17202a; --muted:#5c6773; --line:#d9dee4; --bg:#f3f5f8; --card:#fff;
  --dry:#d8f1df; --dryink:#17663a; --wet:#fbdcdc; --wetink:#9b1c1c; --na:#eef0f3; --warn:#fff2cc;
  --r:10px;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .back{background:none;border:0;color:#fff;font-size:22px;padding:0 6px 0 0;cursor:pointer}
.chip{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap;cursor:pointer;border:0;color:#fff}
.chip.ok{background:#2e8b57}.chip.pend{background:#b7791f}.chip.off{background:#6b7280}
main{max-width:1100px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom) + 80px)}
.tabs{position:sticky;top:calc(env(safe-area-inset-top) + 48px);z-index:15;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px}.card h3{font-size:15px;margin:0 0 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:#fff;color:var(--blue)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:#fff;color:#b42318;border-color:#b42318}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:3px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--muted)}.small{font-size:12px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--na);color:var(--muted)}
.pill.Drying{background:#dbeafe;color:#1e40af}.pill.Dry{background:var(--dry);color:var(--dryink)}.pill.Closed{background:#e5e7eb;color:#374151}
.pill.dry{background:var(--dry);color:var(--dryink)}.pill.wet{background:var(--wet);color:var(--wetink)}
.jobcard{cursor:pointer}
.jobcard:hover{border-color:var(--blue2)}
.bar{height:6px;background:var(--na);border-radius:3px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:#2e8b57}
.banner{padding:10px 12px;border-radius:8px;margin-bottom:12px;font-weight:600}
.banner.ready{background:var(--dry);color:var(--dryink)}.banner.info{background:#e8f1fb;color:var(--blue)}.banner.warn{background:var(--warn);color:#7a5b00}
/* entry list */
.pt{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pt:first-of-type{border-top:0}
.pt .lbl{font-weight:600}
.pt input{width:92px;padding:10px 8px;font-size:18px;text-align:center;border:2px solid var(--line);border-radius:8px;background:#fff}
.pt input.dry{background:var(--dry);border-color:#7cc596}.pt input.wet{background:var(--wet);border-color:#e59a9a}
.trend{font-weight:700}.trend.down{color:#17663a}.trend.up{color:#b42318}.trend.flat{color:var(--muted)}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;background:#fff}
table.g{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.g th,table.g td{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap}
table.g th{background:#f7f9fb;font-weight:600;position:sticky;top:0}
table.g td.l,table.g th.l{text-align:left;position:sticky;left:0;background:#fff;z-index:1;max-width:210px;white-space:normal;min-width:150px}
table.g th.l{background:#f7f9fb;z-index:2}
table.g tr.room td{background:#eef3f9;font-weight:700;text-align:left}
table.g tr.room td.l{background:#eef3f9}
td.dry{background:var(--dry);color:var(--dryink)}td.wet{background:var(--wet);color:var(--wetink)}
td .tr{font-size:11px;margin-left:2px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
@media(min-width:640px){.modal{border-radius:14px}}
.modal h2{margin:0 0 12px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:90vw}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:30;border-radius:99px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.atmo{display:grid;grid-template-columns:1fr 74px 64px;gap:6px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.atmo input{width:100%;padding:9px 6px;font-size:17px;text-align:center;border:2px solid var(--line);border-radius:8px}
.calc{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.calc b{color:var(--ink)}
.gd{color:var(--dryink);font-weight:700}.gd.bad{color:var(--wetink)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
/* report preview (DryTrack-style layout) */
.rep{background:#fff;color:#000;font:12px/1.3 "Times New Roman",Times,serif;overflow-x:auto}
.rep .rh{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:start;gap:8px}
.rep .rh-c{text-align:center;font-size:12px}.rep .rt{color:#2f5e96;font-weight:700;font-size:22px;margin-bottom:2px}
.rep .info{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
@media(max-width:640px){.rep .info{grid-template-columns:1fr}.rep .rh{grid-template-columns:1fr}}
.rep .it{color:#2f5e96;font-weight:700;font-size:13px;margin-bottom:4px}
.rep .ir{display:grid;grid-template-columns:110px 1fr;gap:4px;font-size:11.5px;margin-bottom:2px}.rep .ir i{color:#2f5e96;font-size:10px}
.rep .sec{border:1px solid #000;margin-bottom:12px}
.rep .st{background:#ddf3f7;font-weight:700;padding:5px 7px;border-bottom:1px solid #000}
.rep .pt2{background:#6a8faf;color:#fff;font-weight:700;padding:4px 7px;border-top:2px solid #fff}
.rep table{border-collapse:collapse;width:100%}
.rep th{background:#6a8faf;color:#fff;font-weight:700;text-align:left;padding:4px 6px;border:1px dotted #fff;white-space:pre-line}
.rep td{padding:3px 6px;border:1px dotted #888;text-align:left}
.rep tbody tr:nth-child(even) td{background-color:#e6e6e6}
.rep tr.sep td{border-top:2.5px solid #000}
.rep .rn{font-style:italic;font-size:10.5px;color:#444;padding:4px 7px}
.rep .sig{display:grid;grid-template-columns:2fr 1fr;gap:30px;margin-top:34px}
.rep .sig div{border-top:1px solid #000;padding-top:3px;font-size:11px}
@media print{
  header.top,.tabs,.noprint,.fab,.toast{display:none!important}
  body,main{background:#fff;padding:0;margin:0;max-width:none}
  .card{border:0;padding:0}
  .rep table{page-break-inside:auto}.rep tr{page-break-inside:avoid}
  @page{size:letter;margin:.5in}
}
</style>

<header class="top" id="hdr"></header>
<div id="tabs"></div>
<main id="main"></main>

</script>
<script src="config.js"></script>
<script>
"use strict";
/* ===================== WedryTrack 1.0 ===================== */
const APP = "WedryTrack 1.0";
const LS_KEY = "wedrytrack.v1";
const MATERIALS = ["Drywall","Framing","Wood subfloor","Hardwood","Laminate","Tile","Carpet","Carpet pad","Concrete","Plaster","Cabinetry","Other"];
const METERS = ["GE/Protimeter/MMS2","Protimeter Surveymaster","Delmhorst BD-2100","Tramex ME5","Tramex MRH III"];
const MTYPES = ["Invasive","Non-Invasive"];
const SURFACES = ["Walls","Ceiling","Floor","Subfloor","Framing","Cabinet","Other"];
const COMPANY = {name:"weDRY Restoration, LLC",addr1:"2285 N. Opdyke Rd, Ste E",addr2:"Auburn Hills, MI 48326",phone:"248-752-3222",web:"wedrymi.com"};
const STATUSES = ["Drying","Dry","Closed"];
const ATMO_TYPES = {outside:"Outside", unaffected:"Unaffected area", hvac:"HVAC", chamber:"Affected chamber", dehu:"Dehu outlet"};

/* ---------- psychrometrics (brief: Buck + Magnus, sea level) ---------- */
function fToC(f){return (f-32)*5/9}
function gpp(tf, rh){
  if(!isNum(tf)||!isNum(rh)||rh<=0) return null;
  const T=fToC(tf);
  const es=611.21*Math.exp((18.678-T/234.5)*(T/(257.14+T)));
  const e=(rh/100)*es;
  const W=0.62198*e/(101325-e);
  return W*7000;
}
function dewPoint(tf, rh){
  if(!isNum(tf)||!isNum(rh)||rh<=0) return null;
  const T=fToC(tf);
  const g=Math.log(rh/100)+17.62*T/(243.12+T);
  const td=243.12*g/(17.62-g);
  return td*9/5+32;
}
function isNum(v){return typeof v==="number"&&isFinite(v)}

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDate(s){if(!s)return "";const [y,m,d]=s.split("-");return `${+m}/${+d}/${y.slice(2)}`}
function fmtDateLong(s){if(!s)return "";const [y,m,d]=s.split("-");return `${+m}/${+d}/${y}`}
function f1(n){return isNum(n)?n.toFixed(1):"—"}
function numOrNull(v){if(v===""||v==null)return null;const n=parseFloat(v);return isFinite(n)?n:null}
function toast(msg,ms=2200){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}

/* ---------- storage (local first) ---------- */
let state = {jobs:{}, tech:"", dirty:[]};
function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY); if(raw){const s=JSON.parse(raw); state=Object.assign(state,s); state.dirty=state.dirty||[]; Object.values(state.jobs).forEach(normalizeJob);}}catch(e){console.warn("local load failed",e)}
}
function normalizeJob(j){
  if(!j||typeof j!=="object") return j;
  for(const k of ["email","phone","adjuster","policy","fnol","contacted","arrived","source","cause"]) if(j[k]==null) j[k]="";
  j.rooms=j.rooms||[]; j.points=j.points||[]; j.atmoLocs=j.atmoLocs||[]; j.readings=j.readings||{}; j.atmo=j.atmo||{}; j.visits=j.visits||{};
  for(const r of j.rooms){ if(r.cls==null) r.cls=""; }
  for(const p of j.points){
    if(!p.mtype) p.mtype=/pinless|non/i.test(p.meter||"")?"Non-Invasive":"Invasive";
    if(!p.surface) p.surface="";
  }
  return j;
}
function saveLocal(){
  try{localStorage.setItem(LS_KEY, JSON.stringify(state))}catch(e){toast("Could not save on this device. Storage may be full or blocked.")}
}
function touch(job){
  job.updatedAt=Date.now();
  if(!state.dirty.includes(job.id)) state.dirty.push(job.id);
  saveLocal();
  Sync.schedule();
}
function jobsList(){return Object.values(state.jobs).filter(j=>!j.deleted)}

/* ---------- cloud sync (Supabase) ----------
   Each job is one JSON document. The device keeps the last version it got from the
   server ("base"). On save, the server only accepts the write if nobody else saved
   since that base. If someone did, the app merges field by field (three-way merge)
   and tries again, so two techs working offline on the same job both keep their readings. */
const CFG = window.WEDRY_CONFIG || {};
const BASE_KEY = "wedrytrack.base.v1";
const PROFILE_KEY = "wedrytrack.profile.v1";
const sb = (window.supabase && CFG.supabaseUrl && CFG.supabaseKey)
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:"wedrytrack.auth"}})
  : null;
let base = {};      // id -> {v: server version, doc: server doc}
let me = null;      // {id, email, name, role, active}
try{ base = JSON.parse(localStorage.getItem(BASE_KEY)||"{}") }catch(e){ base = {} }
try{ me = JSON.parse(localStorage.getItem(PROFILE_KEY)||"null") }catch(e){ me = null }
function saveBase(){ try{localStorage.setItem(BASE_KEY, JSON.stringify(base))}catch(e){} }
function isAdmin(){ return !!(me && me.role==="admin") }

function isObj(x){ return x!==null && typeof x==="object" && !Array.isArray(x) }
function same(a,b){ return JSON.stringify(a)===JSON.stringify(b) }
function byId(arr){ return Array.isArray(arr) && arr.every(x=>isObj(x)&&typeof x.id==="string") }
// Three-way merge. preferLocal decides true conflicts (both sides changed the same value differently).
function merge3(b, l, r, preferLocal){
  if(same(l,r)) return l;
  if(same(b,l)) return r;
  if(same(b,r)) return l;
  if(byId(l) && byId(r) && (b===undefined || byId(b))){
    const bm=new Map((b||[]).map(x=>[x.id,x])), lm=new Map(l.map(x=>[x.id,x])), rm=new Map(r.map(x=>[x.id,x]));
    const order=[...l.map(x=>x.id), ...r.map(x=>x.id).filter(id=>!lm.has(id))];
    const out=[];
    for(const id of order){ const m=merge3(bm.get(id), lm.get(id), rm.get(id), preferLocal); if(m!==undefined) out.push(m) }
    return out;
  }
  if(isObj(l) && isObj(r)){
    const bo=isObj(b)?b:{}, out={};
    for(const k of new Set([...Object.keys(l),...Object.keys(r)])){
      const m=merge3(bo[k], l[k], r[k], preferLocal); if(m!==undefined) out[k]=m;
    }
    return out;
  }
  return preferLocal ? l : r;
}
function mergeJob(b, l, r){
  const m = merge3(b, l, r, (l.updatedAt||0) >= (r.updatedAt||0));
  m.updatedAt = Math.max(l.updatedAt||0, r.updatedAt||0);
  m.nextPoint = Math.max(m.nextPoint||1, ...(m.points||[]).map(p=>(p.num||0)+1));
  return normalizeJob(m);
}
function stripJob(j){ const c=JSON.parse(JSON.stringify(j)); return c }

const Sync = {
  status:"local", timer:null, busy:false, readOnly:false, cursor:null, needLogin:false,
  get db(){ return sb && this.session ? sb : null },
  session:null,
  async init(){
    if(!sb){ this.set("local"); return }
    this.cursor = localStorage.getItem("wedrytrack.cursor") || null;
    if(!this.session){ const { data } = await sb.auth.getSession(); this.session = data.session }
    if(!this._authWired){
      this._authWired=true;
      sb.auth.onAuthStateChange((ev, session)=>{
        if(session) this.session = session;
        if(ev==="PASSWORD_RECOVERY") setTimeout(()=>changePassword(true), 300);
        if(ev==="SIGNED_OUT"){ this.session=null; this.set("signedout"); render() }
      });
    }
    if(!this.session){ this.set("signedout"); return }
    if(!this._wired){
      this._wired=true;
      window.addEventListener("online",()=>this.schedule(500));
      document.addEventListener("visibilitychange",()=>{ if(!document.hidden) this.schedule(200) });
      setInterval(()=>this.schedule(0), 30000);
    }
    this.schedule(0);
  },
  set(s){ this.status=s; renderSyncChip() },
  schedule(ms=1500){
    if(!this.db){ renderSyncChip(); return }
    clearTimeout(this.timer); this.timer=setTimeout(()=>this.run(), ms);
    if(this.status==="ok" && state.dirty.length) this.set("pending");
  },
  async run(){
    if(!this.db || this.busy) return;
    if(!navigator.onLine){ this.set(state.dirty.length?"offline":"ok"); return }
    this.busy=true;
    try{
      await this.loadProfile();
      if(me && !me.active){ this.set("inactive"); return }
      await this.pull();
      await this.push();
      this.set(state.dirty.length?"pending":"ok");
    }catch(e){
      console.warn("sync failed", e);
      if(e && (e.status===401 || e.code==="PGRST301" || /JWT|token/i.test(e.message||""))){ this.set("signedout"); this.session=null }
      else this.set(state.dirty.length?"offline":"ok");
      if(this.status==="signedout") softRender();
    }finally{ this.busy=false }
    if(state.dirty.length && this.status!=="signedout") { clearTimeout(this.timer); this.timer=setTimeout(()=>this.run(), 15000) }
  },
  async loadProfile(){
    const uid=this.session?.user?.id; if(!uid) return;
    const { data, error } = await sb.from("profiles").select("id,email,name,role,active").eq("id", uid).maybeSingle();
    if(error) throw error;
    if(data){
      const changed = !me || me.id!==data.id || me.name!==data.name || me.role!==data.role || me.active!==data.active;
      me=data; localStorage.setItem(PROFILE_KEY, JSON.stringify(me));
      if(data.name && state.tech!==data.name){ state.tech=data.name; saveLocal() }
      if(changed) softRender();
    }
  },
  async pull(){
    let changed=false, first=true;
    for(;;){
      let q = sb.from("jobs").select("id,doc,version,deleted,updated_at").order("updated_at",{ascending:true}).limit(200);
      // First page re-reads a few seconds back so a save that committed late is never missed.
      if(this.cursor) q = q.gt("updated_at", first ? new Date(Date.parse(this.cursor)-10000).toISOString() : this.cursor);
      first=false;
      const { data, error } = await q;
      if(error) throw error;
      for(const row of data){
        const remote = normalizeJob(Object.assign({}, row.doc, {deleted: !!row.deleted || !!row.doc.deleted}));
        const local = state.jobs[row.id];
        const known = base[row.id];
        if(known && known.v >= row.version) continue;
        if(!local || !state.dirty.includes(row.id)){
          state.jobs[row.id] = remote;
        } else {
          state.jobs[row.id] = mergeJob(known ? known.doc : undefined, local, remote);
        }
        base[row.id] = {v: row.version, doc: stripJob(remote)};
        changed=true;
      }
      if(data.length){ this.cursor = data[data.length-1].updated_at; localStorage.setItem("wedrytrack.cursor", this.cursor) }
      if(data.length < 200) break;
    }
    if(changed){ saveLocal(); saveBase(); softRender() }
  },
  async push(){
    for(const id of [...state.dirty]){
      const j = state.jobs[id];
      if(!j){ state.dirty = state.dirty.filter(x=>x!==id); continue }
      const stamp = j.updatedAt;
      const doc = stripJob(j);
      const b = base[id] ? base[id].v : 0;
      const { data: v, error } = await sb.rpc("save_job", {p_id:id, p_doc:doc, p_deleted:!!j.deleted, p_base:b});
      if(error){
        if(/admin/i.test(error.message||"")){ j.deleted=false; toast("Only an admin can delete a job"); softRender() }
        throw error;
      }
      if(v==null){ await this.pull(); continue }   // someone saved first: merged on pull, retried next round
      base[id] = {v, doc};
      if(state.jobs[id] && state.jobs[id].updatedAt===stamp) state.dirty = state.dirty.filter(x=>x!==id);
      saveBase(); saveLocal();
    }
  },
  async flush(){ return this.run() }
};

/* ---------- sign in, account, users ---------- */
function renderLogin(){
  $("#hdr").innerHTML=`<h1>${esc(APP)}</h1>`;
  $("#tabs").innerHTML="";
  const off=!navigator.onLine;
  $("#main").innerHTML=`<div class="card" style="max-width:420px;margin:40px auto">
    <img src="wedry-logo-light.png" alt="weDRY" style="width:180px;max-width:100%;display:block;margin:0 auto 14px">
    <h2 style="margin-top:0">Sign in</h2>
    ${off?`<p class="small" style="background:var(--warn);padding:8px;border-radius:8px">You are offline. Sign in once with a signal. After that the app works with no signal.</p>`:""}
    <form id="loginf" onsubmit="return false">
      <label class="f">Email<input id="l_e" type="email" autocomplete="username" required></label>

/* ---------- domain logic ---------- */
function newJob(){
  return {id:uid(),jobNumber:"",customer:"",address:"",claim:"",carrier:"",dol:"",category:"",cls:"",status:"Drying",
    startDate:"",dryOutDate:"",notes:"",source:"",cause:"",email:"",phone:"",adjuster:"",policy:"",fnol:"",contacted:"",arrived:"",rooms:[],points:[],readings:{},atmoLocs:[],atmo:{},visits:{},nextPoint:1,createdBy:state.tech||"",updatedAt:Date.now(),deleted:false};
}
function roomPoints(job,roomId){return job.points.filter(p=>p.roomId===roomId).sort((a,b)=>a.num-b.num)}
function visitDates(job){
  const s=new Set();
  for(const d in (job.visits||{})){const v=job.visits[d]; if(v&&(v.arrival||v.depart||v.notes||v.hvac)) s.add(d)}
  for(const pid in job.readings) for(const d in job.readings[pid]) if(isNum(job.readings[pid][d]?.v)) s.add(d);
  for(const lid in job.atmo) for(const d in job.atmo[lid]) { const r=job.atmo[lid][d]; if(r&&(isNum(r.t)||isNum(r.rh))) s.add(d) }
  return [...s].sort();
}
function readingOn(job,pid,date){const r=job.readings[pid]?.[date];return r&&isNum(r.v)?r.v:null}
function prevReading(job,pid,date){
  const m=job.readings[pid]||{}; let best=null,bd=null;
  for(const d in m){ if(d<date && isNum(m[d]?.v) && (bd===null||d>bd)){bd=d;best=m[d].v} }
  return best;
}
function latestReading(job,pid){
  const m=job.readings[pid]||{}; let best=null,bd=null;
  for(const d in m){ if(isNum(m[d]?.v)&&(bd===null||d>bd)){bd=d;best=m[d].v} }
  return best;
}
function cellState(v,goal){ if(!isNum(v)||!isNum(goal)) return ""; return v<=goal?"dry":"wet" }
function isRemoved(p,date){return !!(p.removed && date>=p.removed)}
function activePoints(job){return job.points.filter(p=>!p.removed)}
function pointDry(job,p){ const v=latestReading(job,p.id); if(!isNum(v)||!isNum(p.goal)) return null; return v<=p.goal }
function trendOf(v,prev){
  if(!isNum(v)||!isNum(prev)) return "";
  if(v<prev) return `<span class="trend down" title="Down from ${prev}">▼</span>`;
  if(v>prev) return `<span class="trend up" title="Up from ${prev}">▲</span>`;
  return `<span class="trend flat" title="Same as last visit">=</span>`;
}
function roomStatus(job,room){
  const pts=roomPoints(job,room.id).filter(p=>isNum(p.goal)&&!p.removed);
  if(!pts.length) return {state:"none",dry:0,total:0};
  const dry=pts.filter(p=>pointDry(job,p)===true).length;
  return {state:dry===pts.length?"dry":"wet",dry,total:pts.length};
}
function jobProgress(job){
  const pts=activePoints(job).filter(p=>isNum(p.goal));
  const dry=pts.filter(p=>pointDry(job,p)===true).length;
  return {dry,total:pts.length,ready:pts.length>0&&dry===pts.length};
}
function atmoLoc(job,id){return job.atmoLocs.find(l=>l.id===id)}
function atmoCalc(job,locId,date){
  const r=job.atmo[locId]?.[date]; if(!r) return {t:null,rh:null,gpp:null,dp:null};
  const g=gpp(r.t,r.rh), dp=dewPoint(r.t,r.rh);
  return {t:isNum(r.t)?r.t:null,rh:isNum(r.rh)?r.rh:null,gpp:g,dp};
}
function grainDepression(job,dehu,date){
  if(!dehu.chamberId) return null;
  const c=atmoCalc(job,dehu.chamberId,date).gpp, o=atmoCalc(job,dehu.id,date).gpp;
  if(!isNum(c)||!isNum(o)) return null;
  return c-o;
}
function locLabel(job,l){
  let s=l.label||ATMO_TYPES[l.type];
  if(l.type==="dehu"&&l.chamberId){const c=atmoLoc(job,l.chamberId); if(c) s+=` (in ${c.label||"chamber"})`}
  return s;
}
function sortedLocs(job){
  const order={outside:0,unaffected:1,hvac:2,chamber:3,dehu:4};
  const out=[];
  const chambers=job.atmoLocs.filter(l=>l.type==="chamber");
  for(const l of job.atmoLocs.filter(l=>l.type==="outside"||l.type==="unaffected"||l.type==="hvac").sort((a,b)=>order[a.type]-order[b.type])) out.push(l);
  for(const c of chambers){out.push(c); for(const d of job.atmoLocs.filter(l=>l.type==="dehu"&&l.chamberId===c.id)) out.push(d)}
  for(const d of job.atmoLocs.filter(l=>l.type==="dehu"&&!chambers.some(c=>c.id===l.chamberId))) out.push(d);
  return out;
}
function recordVisit(job,date){
  job.visits=job.visits||{};
  if(!job.startDate) job.startDate=date;
  if(!job.visits[date]) job.visits[date]={tech:state.tech||""};
  else if(!job.visits[date].tech && state.tech) job.visits[date].tech=state.tech;
}
function techsForDate(job,date){
  const s=new Set(); const v=job.visits?.[date]; if(v?.tech) s.add(v.tech);
  for(const pid in job.readings){const r=job.readings[pid][date]; if(r?.tech) s.add(r.tech)}
  for(const lid in job.atmo){const r=job.atmo[lid][date]; if(r?.tech) s.add(r.tech)}
  return [...s].join(", ");
}

/* --- Readings entry --- */
function tabReadings(job){
  const d=ui.date;
  if(!job.rooms.length) return `<div class="card empty">Add rooms and moisture points first.<br><br><button class="btn" onclick="ui.tab='rooms';render()">Rooms & points</button></div>`;
  const dates=visitDates(job);
  let html=`<div class="card"><div class="row">
      <label class="f grow" style="margin:0">Visit date<input type="date" value="${d}" onchange="ui.date=this.value||today();render()"></label>
    </div>
    <div class="small muted" style="margin-top:6px">Tech: <b>${esc(job.visits?.[d]?.tech||state.tech||"not set")}</b>${dates.length?` · Visits: ${dates.map(x=>`<a href="javascript:void 0" onclick="ui.date='${x}';render()">${fmtDate(x)}</a>`).join(", ")}`:""}</div>
    ${visitFields(job,d)}
  </div>`;
  if(!job.points.length) return html+`<div class="card empty">No moisture points yet.<br><br><button class="btn" onclick="ui.tab='rooms';render()">Add points</button></div>`;
  const live=job.points.filter(p=>!isRemoved(p,d));
  const missing=live.filter(p=>!isNum(readingOn(job,p.id,d))).length;
  const started=live.length-missing;
  if(started>0&&missing>0) html+=`<div class="banner warn" id="missbanner">${missing} of ${live.length} points have no reading for ${fmtDate(d)}.</div>`;
  else html+=`<div id="missbanner"></div>`;
  for(const room of job.rooms){
    const pts=roomPoints(job,room.id).filter(p=>!isRemoved(p,d)); if(!pts.length) continue;
    const rs=roomStatus(job,room);
    html+=`<div class="card"><div class="row" style="margin-bottom:4px"><h3 class="grow" style="margin:0">${esc(room.name)}</h3>
      ${rs.state==="none"?"":`<span class="pill ${rs.state}">${rs.state==="dry"?"Dry":`${rs.dry}/${rs.total} dry`}</span>`}</div>`;
    for(const p of pts){
      const v=readingOn(job,p.id,d), prev=prevReading(job,p.id,d);
      html+=`<div class="pt"><div>
          <div class="lbl">#${p.num} ${esc(p.label)}</div>
          <div class="small muted">${esc(p.material)}${p.surface?" · "+esc(p.surface):""} · ${esc(p.mtype||"")} · goal <b>${isNum(p.goal)?p.goal:"not set"}</b>${isNum(prev)?` · last ${prev}`:""} <span id="tr_${p.id}">${trendOf(v,prev)}</span></div>
        </div>
        <input inputmode="decimal" type="text" data-pid="${p.id}" value="${isNum(v)?v:""}" class="${cellState(v,p.goal)}" aria-label="Reading for point ${p.num}" oninput="onReading(this)" onchange="commitReading(this)" enterkeyhint="next" onkeydown="if(event.key==='Enter'){event.preventDefault();nextInput(this)}">
      </div>`;
    }
    html+=`</div>`;
  }
  return html;
}
function nextInput(el){const all=[...document.querySelectorAll("#main input[data-pid],#main input[data-atmo]")];const i=all.indexOf(el);if(all[i+1])all[i+1].focus();else el.blur()}
function curJob(){const r=route();return r.view==="job"?state.jobs[r.id]:null}
function onReading(el){
  const job=curJob(); const p=job.points.find(x=>x.id===el.dataset.pid); const v=numOrNull(el.value);
  el.className=cellState(v,p.goal);
  const tr=document.getElementById("tr_"+p.id); if(tr) tr.innerHTML=trendOf(v,prevReading(job,p.id,ui.date));
}
function commitReading(el){
  const job=curJob(); const pid=el.dataset.pid; const v=numOrNull(el.value);
  if(el.value.trim()!==""&&v===null){toast("Enter a number");return}
  job.readings[pid]=job.readings[pid]||{};
  const prev=job.readings[pid][ui.date];
  if(v===null) delete job.readings[pid][ui.date];
  else {
    const now=Date.now();
    const r={v,tech:state.tech||"",at:prev?.at||now};
    if(prev&&prev.v!==v){r.editedAt=now;r.editedBy=state.tech||"";r.orig=prev.orig??prev.v}
    if(ui.date<today()) r.lateEntry=true;
    job.readings[pid][ui.date]=r; recordVisit(job,ui.date);
  }
  touch(job);
  ui.pendingRender=true;
}
function visitFields(job,d){
  const v=job.visits?.[d]||{};
  return `<details style="margin-top:8px" ${v.arrival||v.depart||v.notes||v.hvac?"open":""}><summary class="small" style="cursor:pointer;color:var(--blue)">Visit details</summary>
    <div class="grid2" style="margin-top:8px">
      <label class="f">Arrival time<input type="time" value="${esc(v.arrival||"")}" onchange="setVisit('arrival',this.value)"></label>
      <label class="f">Departure time<input type="time" value="${esc(v.depart||"")}" onchange="setVisit('depart',this.value)"></label>

function setVisit(k,val){const job=curJob();recordVisit(job,ui.date);job.visits[ui.date][k]=val;touch(job)}

/* --- Grid --- */
function tabGrid(job){
  const dates=visitDates(job).filter(d=>job.points.some(p=>isNum(readingOn(job,p.id,d))));
  if(!job.points.length) return `<div class="card empty">No moisture points yet.</div>`;
  let h=`<div class="small muted" style="margin-bottom:6px">Green is at or below dry goal, red is above. Arrows compare to the previous visit.</div><div class="tw"><table class="g"><thead><tr><th class="l">Point</th><th>Material</th><th>Goal</th>${dates.map(d=>`<th>${fmtDate(d)}</th>`).join("")}</tr></thead><tbody>`;
  for(const room of job.rooms){
    const pts=roomPoints(job,room.id); if(!pts.length) continue;
    const rs=roomStatus(job,room);
    h+=`<tr class="room"><td class="l">${esc(room.name)}${room.affected?"":" (unaffected)"}</td><td colspan="${2+dates.length}">${rs.state==="none"?"":rs.state==="dry"?`<span class="pill dry">Room dry</span>`:`<span class="pill wet">${rs.dry}/${rs.total} at goal</span>`}</td></tr>`;
    for(const p of pts){
      h+=`<tr><td class="l">#${p.num} ${esc(p.label)}${p.removed?` <span class="small muted">(removed ${fmtDate(p.removed)})</span>`:""}</td><td>${esc(p.material)}</td><td><b>${isNum(p.goal)?p.goal:"—"}</b></td>`;
      for(const d of dates){
        const v=readingOn(job,p.id,d);
        if(isRemoved(p,d)&&!isNum(v)){h+=`<td class="small muted">Removed</td>`;continue}
        if(!isNum(v)){h+=`<td></td>`;continue}
        const pr=prevReading(job,p.id,d);
        h+=`<td class="${cellState(v,p.goal)}">${v}<span class="tr">${trendOf(v,pr)}</span></td>`;
      }
      h+=`</tr>`;
    }
  }
  h+=`</tbody></table></div>`;
  if(!dates.length) h+=`<div class="empty">No readings yet. Enter them on the Readings tab.</div>`;
  return h;
}

/* --- Atmospherics --- */
function tabAtmo(job){
  const d=ui.atmoDate; const locs=sortedLocs(job);
  let h=`<div class="card"><div class="row"><label class="f grow" style="margin:0">Visit date<input type="date" value="${d}" onchange="ui.atmoDate=this.value||today();render()"></label></div>
    <div class="row" style="margin-top:8px"><button class="btn sec sm" onclick="addLoc('outside')">+ Outside</button><button class="btn sec sm" onclick="addLoc('unaffected')">+ Unaffected</button><button class="btn sec sm" onclick="addLoc('hvac')">+ HVAC</button><button class="btn sec sm" onclick="addLoc('chamber')">+ Chamber</button><button class="btn sec sm" onclick="addLoc('dehu')">+ Dehu outlet</button></div></div>`;
  if(!locs.length) return h+`<div class="card empty">Add the locations you read each visit: outside, unaffected area, each affected chamber, and each dehu outlet.</div>`;
  h+=`<div class="card"><div class="atmo small muted" style="border:0;padding-top:0"><div>Location</div><div style="text-align:center">Temp °F</div><div style="text-align:center">RH %</div></div>`;
  for(const l of locs){
    const c=atmoCalc(job,l.id,d);
    const gd=l.type==="dehu"?grainDepression(job,l,d):null;
    h+=`<div class="atmo"><div><b>${esc(locLabel(job,l))}</b><div class="small muted">${ATMO_TYPES[l.type]} · <a href="javascript:void 0" onclick="editLoc('${l.id}')">edit</a></div></div>
      <input inputmode="decimal" data-atmo="${l.id}" data-k="t" value="${isNum(c.t)?c.t:""}" onchange="commitAtmo(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();nextInput(this)}" aria-label="Temperature">
      <input inputmode="decimal" data-atmo="${l.id}" data-k="rh" value="${isNum(c.rh)?c.rh:""}" onchange="commitAtmo(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();nextInput(this)}" aria-label="Relative humidity">
      <div class="calc" id="calc_${l.id}">${calcLine(job,l,d)}</div></div>`;
  }
  h+=`</div>`;
  const dates=visitDates(job).filter(dd=>locs.some(l=>isNum(atmoCalc(job,l.id,dd).gpp)));
  if(dates.length){
    h+=`<h3 style="margin:16px 0 6px">History</h3><div class="tw"><table class="g"><thead><tr><th class="l">Location</th>${dates.map(x=>`<th colspan="1">${fmtDate(x)}</th>`).join("")}</tr></thead><tbody>`;
    for(const l of locs){
      h+=`<tr><td class="l">${esc(locLabel(job,l))}</td>`;
      for(const x of dates){
        const c=atmoCalc(job,l.id,x);
        if(!isNum(c.gpp)){h+=`<td></td>`;continue}
        let s=`${f1(c.t)}°/${f1(c.rh)}%<br><b>${f1(c.gpp)}</b> gpp`;
        if(l.type==="dehu"){const g=grainDepression(job,l,x); if(isNum(g)) s+=`<br><span class="gd ${g<=0?"bad":""}">GD ${f1(g)}</span>`}
        h+=`<td>${s}</td>`;
      }
      h+=`</tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  return h;
}
function calcLine(job,l,d){
  const c=atmoCalc(job,l.id,d);
  if(!isNum(c.gpp)) return `<span>Enter temp and RH</span>`;
  let s=`<span>GPP <b>${f1(c.gpp)}</b></span><span>Dew point <b>${f1(c.dp)}°F</b></span>`;
  if(l.type==="dehu"){
    if(!l.chamberId) s+=`<span>Link a chamber to get grain depression</span>`;
    else {const g=grainDepression(job,l,d); s+= isNum(g)?`<span>Grain depression <b class="gd ${g<=0?"bad":""}">${f1(g)}</b></span>`:`<span>Enter the chamber reading for grain depression</span>`}
  }
  return s;
}
function commitAtmo(el){
  const job=curJob(); const id=el.dataset.atmo, k=el.dataset.k; const v=numOrNull(el.value);
  if(el.value.trim()!==""&&v===null){toast("Enter a number");return}
  if(k==="rh"&&v!==null&&(v<=0||v>100)){toast("RH must be between 0 and 100");return}
  job.atmo[id]=job.atmo[id]||{};
  const r=job.atmo[id][ui.atmoDate]||{t:null,rh:null};
  r[k]=v; r.tech=state.tech||r.tech||"";
  if(r.t===null&&r.rh===null) delete job.atmo[id][ui.atmoDate]; else {job.atmo[id][ui.atmoDate]=r; recordVisit(job,ui.atmoDate)}
  touch(job);
  // refresh calc lines (this location and dehus tied to it)
  for(const l of job.atmoLocs){ const c=document.getElementById("calc_"+l.id); if(c) c.innerHTML=calcLine(job,l,ui.atmoDate) }
  ui.pendingRender=true;
}
function addLoc(type){ const job=curJob(); locForm(job,{id:uid(),type,label:type==="outside"?"Outside":type==="unaffected"?"Unaffected area":type==="hvac"?"HVAC supply":"",roomId:"",chamberId:""},true) }
function editLoc(id){ const job=curJob(); locForm(job,{...atmoLoc(job,id)},false) }

  $("#m_ok").onclick=()=>{

    for(const x of job.atmoLocs) if(x.chamberId===l.id) x.chamberId="";
    touch(job); render();
  });
}

/* --- Rooms & points --- */
function tabRooms(job){
  let h=`<div class="row" style="margin-bottom:12px"><button class="btn" onclick="roomForm(null)">+ Add room</button><span class="grow"></span></div>`;
  if(!job.rooms.length) return h+`<div class="card empty">Add each room you are drying, plus an unaffected room for dry standards if you want them on record.</div>`;
  job.rooms.forEach((room,idx)=>{
    const pts=roomPoints(job,room.id);
    h+=`<div class="card"><div class="row"><h3 class="grow" style="margin:0">${esc(room.name)} <span class="pill ${room.affected?"wet":"dry"}" style="font-weight:500">${room.affected?"Affected":"Unaffected"}</span>${room.level?` <span class="small muted" style="font-weight:400">${esc(room.level)}</span>`:""}</h3>
      <button class="btn sec sm" onclick="moveRoom('${room.id}',-1)" ${idx===0?"disabled":""} aria-label="Move up">↑</button>

      <div style="margin-top:8px"><button class="btn sec sm" onclick="pointForm('${room.id}',null)">+ Add moisture point</button></div></div>`;

function wetSf(room){const a=[["floor",room.sfFloor],["walls",room.sfWall],["ceiling",room.sfCeil]].filter(x=>isNum(x[1]));return a.length?"Wet SF: "+a.map(x=>`${x[0]} ${x[1]}`).join(", "):""}
function roomExtras(room){return [wetSf(room),room.preExisting?"Pre-existing: "+esc(room.preExisting):""].filter(Boolean).join(" · ")}
function moveRoom(id,dir){const job=curJob();const i=job.rooms.findIndex(r=>r.id===id);const j=i+dir;if(j<0||j>=job.rooms.length)return;[job.rooms[i],job.rooms[j]]=[job.rooms[j],job.rooms[i]];touch(job);render()}

function infoChange(e){
  const job=curJob(); const el=e.target; if(!el.name) return;
  job[el.name]=el.value; touch(job);
  if(el.name==="status"||el.name==="customer") ui.pendingRender=true;
}
function deleteJob(id){
  const job=state.jobs[id];
  if(sb && !isAdmin()){toast("Only an admin can delete a job");return}
  confirmBox(`Delete the job for ${esc(job.customer||"this customer")}? This removes all its readings${Sync.db?" for everyone":""}.`,()=>{job.deleted=true;touch(job);go("jobs")});
}
function jobForm(job,isNew){
  modal(`<h2>New job</h2>
    <label class="f">Customer name<input id="m_cust"></label>
    <label class="f">Property address<input id="m_addr"></label>
    <div class="grid2">
      <label class="f">Internal job number<input id="m_jn"></label>
      <label class="f">Date of loss<input type="date" id="m_dol"></label>
      <label class="f">Water category<select id="m_cat"><option value="">Select</option><option value="1">Category 1</option><option value="2">Category 2</option><option value="3">Category 3</option></select></label>
      <label class="f">Water class<select id="m_cls"><option value="">Select</option><option value="1">Class 1</option><option value="2">Class 2</option><option value="3">Class 3</option><option value="4">Class 4</option></select></label>
    </div>
    <div class="small muted" style="margin-bottom:10px">Carrier, claim number and dates are on the Job info tab.</div>
    <div class="row"><span class="grow"></span><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" id="m_ok">Create job</button></div>`);
  setTimeout(()=>$("#m_cust")?.focus(),50);
  $("#m_ok").onclick=()=>{
    job.customer=$("#m_cust").value.trim(); job.address=$("#m_addr").value.trim(); job.jobNumber=$("#m_jn").value.trim();
    job.dol=$("#m_dol").value; job.category=$("#m_cat").value; job.cls=$("#m_cls").value;
    if(!job.customer&&!job.jobNumber){toast("Enter a customer name or job number");return}
    state.jobs[job.id]=job; touch(job); closeModal(); ui.tab="rooms"; ui.date=today(); ui.atmoDate=today(); go("job-"+job.id);
  };
}

function tabReport(job){
  return `<div class="card noprint"><div class="row">
      <button class="btn" id="pdfbtn" onclick="downloadPdf('${job.id}')">Download PDF</button>
      <button class="btn sec" id="printbtn" onclick="window.print()" style="display:none">Print</button>
      <span class="grow"></span>
    </div>
    <div class="small muted" style="margin-top:6px">Preview below. Laid out like the DryTrack Water Mitigation Report, letter size.</div></div>
    <div class="card rep" id="rep">${reportHtml(job)}</div>`;
}
function afterReport(job){
  // Printing works when hosted on its own; the Claude preview frame blocks it.
  const inFrame = (()=>{try{return window.self!==window.top}catch(e){return true}})();
  if(!inFrame) $("#printbtn").style.display="";
}
function fmtTime(t){if(!t)return "";const [H,M]=t.split(":").map(Number);return `${(H%12)||12}:${String(M).padStart(2,"0")} ${H<12?"AM":"PM"}`}
function editedMark(job,pid,d){const r=job.readings[pid]?.[d];return r&&r.editedAt?`<sup title="Edited ${new Date(r.editedAt).toLocaleString()} by ${esc(r.editedBy||"")}, originally ${r.orig}">*</sup>`:""}
function dayNum(start,d){const a=new Date(start+"T12:00"),b=new Date(d+"T12:00");const n=Math.round((b-a)/864e5)+1;return n>=1?n:"—"}

async function downloadPdf(id){
  const job=state.jobs[id];
  if(!window.jspdf){toast("PDF library did not load");return}
  const btn=$("#pdfbtn"); btn.disabled=true; btn.textContent="Building PDF…";
  try{
    const doc=buildPdf(job);
    const name=`DryLog_${(job.jobNumber||job.customer||"job").replace(/[^A-Za-z0-9]+/g,"_")}_${today()}.pdf`;
    await saveFile(name, doc.output("blob"));
  }catch(e){console.error(e);toast("Could not build the PDF")}
  finally{btn.disabled=false;btn.textContent="Download PDF"}
}
async function saveFile(name,blob){
  let dl=null;
  try{ if(window.claude&&window.claude.use) dl=await Promise.race([window.claude.use("downloads"),new Promise(r=>setTimeout(()=>r(null),3000))]) }catch(e){dl=null}
  if(dl){
    try{await dl.save({filename:name,data:blob}); toast("Saved "+name)}
    catch(e){ if(e&&e.code==="declined") return; toast("Download not available here ("+(e&&e.code||"error")+")") }
    return;
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}

function reportModel(job){
  const dates=visitDates(job);
  const vnum={}; dates.forEach((d,i)=>vnum[d]=i+1);
  const mDates=dates.filter(d=>job.points.some(p=>isNum(readingOn(job,p.id,d))));
  const locs=sortedLocs(job);
  const aDates=dates.filter(d=>locs.some(l=>isNum(atmoCalc(job,l.id,d).gpp)));
  return {dates,vnum,mDates,locs,aDates,prog:jobProgress(job)};
}
function fmtDT(v){ if(!v) return ""; const [d,t]=v.split("T"); return fmtDateLong(d)+(t?" "+fmtTime(t.slice(0,5)):"") }
function elapsed(from,to){
  if(!from||!to) return "";
  const ms=new Date(to)-new Date(from); if(!(ms>=0)) return "";
  const m=Math.round(ms/60000), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  return [d?`${d} day${d>1?"s":""}`:"",h?`${h} hr`:"",`${mm} min`].filter(Boolean).join(" ");
}
function duration(a,b){
  if(!a||!b) return "";
  const [h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number);
  let m=(h2*60+m2)-(h1*60+m1); if(m<0) m+=1440;
  return `${Math.floor(m/60)} hr ${m%60} min`;
}
function i0(n){return isNum(n)?String(Math.round(n)):""}
function vlabel(m,d){return `${m.vnum[d]}  (${fmtDate(d)})`}

/* Builds the dry log as data: header blocks + sections of tables.
   Both the on-screen preview and the PDF render from this, so they always match.
   Cell: string or {t, bg:"dry"|"wet"|"group", b:bold, span} */
function reportDoc(job){
  const m=reportModel(job);
  const cell=(t,o={})=>Object.assign({t:t==null?"":String(t)},o);
  const doc={m,sections:[]};
  doc.info=[
    {title:"Policyholder Information",rows:[["Customer",job.customer],["Address",job.address],["E-mail",job.email],["Phone",job.phone],["Job number",job.jobNumber],["Report generated",fmtDateLong(today())]]},
    {title:"Insurance Information",rows:[["Insurance company",job.carrier],["Adjuster",job.adjuster],["Claim number",job.claim],["Policy number",job.policy],["Date of loss",fmtDateLong(job.dol)],["Cause of loss",job.cause]]},
    {title:"Job Dates",rows:[
      ["First notice of loss",fmtDT(job.fnol)],
      ["Date contacted",fmtDT(job.contacted)+(elapsed(job.fnol,job.contacted)?`\n${elapsed(job.fnol,job.contacted)} to contact`:"")],
      ["Arrived on site",fmtDT(job.arrived)+(elapsed(job.fnol,job.arrived)?`\n${elapsed(job.fnol,job.arrived)} to arrive`:"")],
      ["Drying started",fmtDateLong(job.startDate)],
      ["Drying completed",fmtDateLong(job.dryOutDate)],
      ["Water category / class",[job.category?"Cat "+job.category:"",job.cls?"Class "+job.cls:""].filter(Boolean).join(" / ")]]}
  ];
  // Drying standards
  const stdMap=new Map();
  for(const p of job.points){
    if(!isNum(p.goal)&&!isNum(p.standard)) continue;
    const key=[p.material,p.meter,p.mtype,p.standard,p.goal].join("|");
    const room=job.rooms.find(r=>r.id===p.roomId)?.name||"";
    if(!stdMap.has(key)) stdMap.set(key,{p,rooms:new Set(),src:p.goalNote});
    stdMap.get(key).rooms.add(room); if(!stdMap.get(key).src&&p.goalNote) stdMap.get(key).src=p.goalNote;
  }
  doc.sections.push({title:"Drying Standards for Job",tables:[{
    head:["Material","Meter","Type","Drying Standard","Goal Deviation","Goal","Standard Taken At","Applies To"],
    body:[...stdMap.values()].map(({p,rooms,src})=>{const dev=isNum(p.standard)&&isNum(p.goal)&&p.standard!==0?Math.round((p.goal-p.standard)/p.standard*100)+"%":"";return [p.material,p.meter||"",p.mtype||"",isNum(p.standard)?p.standard:"",dev,isNum(p.goal)?p.goal:"",src||"",[...rooms].join(", ")]}),
    empty:"No drying standards recorded.",widths:{3:52,4:48,5:36}
  }]});
  // Visits
  doc.sections.push({title:"Visits",tables:[{
    head:["Visit","Date","Arrival","Departure","Duration","Day","Technician","HVAC","Notes"],
    body:m.dates.map(d=>{const v=job.visits?.[d]||{};return [m.vnum[d],fmtDateLong(d),fmtTime(v.arrival),fmtTime(v.depart),duration(v.arrival,v.depart),job.startDate?dayNum(job.startDate,d):"",techsForDate(job,d),v.hvac||"",v.notes||""]}),
    empty:"No visits recorded.",widths:{0:30,1:56,2:46,3:50,4:52,5:26,7:32}
  }]});
  // Rooms
  doc.sections.push({title:"Rooms",tables:[{
    head:["Name","Class","Level","Condition","Floor SF Wet","Walls SF Wet","Ceiling SF Wet","Status","Pre-existing Conditions"],
    body:job.rooms.map(r=>{const rs=roomStatus(job,r);return [r.name,r.cls||"",r.level||"",r.affected?"Affected":"Unaffected",isNum(r.sfFloor)?r.sfFloor:"",isNum(r.sfWall)?r.sfWall:"",isNum(r.sfCeil)?r.sfCeil:"",cell(rs.state==="dry"?"Dry":rs.state==="wet"?`${rs.dry}/${rs.total} at goal`:"",{bg:rs.state==="dry"?"dry":rs.state==="wet"?"wet":""}),r.preExisting||""]}),
    empty:"No rooms recorded.",widths:{1:32,2:56,3:56,4:40,5:40,6:44}
  }]});
  // Moisture readings summary
  const sum=[];
  for(const room of job.rooms){
    const pts=roomPoints(job,room.id); if(!pts.length) continue;
    sum.push([cell(room.name,{bg:"group",span:6})]);
    const groups=new Map();
    for(const p of pts){const k=[p.material,p.meter,p.mtype,p.goal].join("|"); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(p)}
    for(const [,gp] of groups){
      const p0=gp[0];
      for(const d of m.mDates){
        const vals=gp.map(p=>readingOn(job,p.id,d)).filter(isNum); if(!vals.length) continue;
        const avg=vals.reduce((a,b)=>a+b,0)/vals.length; const st=cellState(avg,p0.goal);
        sum.push([vlabel(m,d),p0.material,p0.meter||"",p0.mtype||"",isNum(p0.goal)?p0.goal:"",cell(Number.isInteger(avg)?avg:avg.toFixed(1),{bg:st,b:true})]);
      }
    }
  }
  doc.sections.push({title:"Moisture Readings Summary",tables:[{head:["Visit","Material","Meter","Type","Goal","Avg"],body:sum,empty:"No moisture readings recorded.",widths:{0:80,4:40,5:40}}],
    note:"Avg is the average of all points of the same material, meter and type in the room for that visit. Green is at or below goal, red is above."});
  // Atmospheric summary (chart) + detail
  doc.chart=atmoChartData(job,m);
  const det=[];
  for(const l of m.locs){
    let first=true;
    for(const d of m.aDates){
      const c=atmoCalc(job,l.id,d); if(!isNum(c.gpp)) continue;
      const gd=l.type==="dehu"?grainDepression(job,l,d):null;
      det.push({sep:first,row:[vlabel(m,d),ATMO_TYPES[l.type],locLabel(job,l),i0(c.t),i0(c.rh),i0(c.gpp),i0(c.dp),cell(isNum(gd)?i0(gd):"",{b:true,bg:isNum(gd)?(gd>0?"dry":"wet"):""})]});
      first=false;
    }
  }
  doc.sections.push({title:"Atmospheric Readings Detail",tables:[{head:["Visit","Area Type","Area / Dehu","Temperature (°F)","Relative Humidity (%)","GPP","Dew Point (°F)","Grain Depression"],body:det.map(x=>x.row),seps:det.map(x=>x.sep),empty:"No atmospheric readings recorded.",widths:{0:70,3:58,4:62,5:36,6:50,7:58}}],
    note:"GPP = grains of moisture per pound of dry air. Grain depression = affected chamber GPP minus dehumidifier outlet GPP for the same visit. Calculated at sea-level pressure."});
  // Moisture content detail: one small table per point
  const chunks=[]; for(let i=0;i<m.mDates.length;i+=10) chunks.push(m.mDates.slice(i,i+10)); if(!chunks.length) chunks.push([]);
  const det2=[];
  for(const room of job.rooms){
    for(const p of roomPoints(job,room.id)){
      const title=[room.name,p.material,p.surface,`#${p.num} ${p.label}`,p.meter,p.mtype].filter(Boolean).join(" / ")+(p.removed?`  (removed ${fmtDateLong(p.removed)})`:"");
      for(const ds of chunks){
        det2.push({title,head:["Visit",...ds.map(d=>`${m.vnum[d]}\n${fmtDate(d)}`),"Goal"],
          body:[["",...ds.map(d=>{const v=readingOn(job,p.id,d); if(!isNum(v)&&isRemoved(p,d)) return cell("Removed"); const r=job.readings[p.id]?.[d]; return cell(isNum(v)?v+(r&&r.editedAt?"*":""):"",{bg:cellState(v,p.goal)})}),cell(isNum(p.goal)?p.goal:"",{b:true})]],
          widths:{0:40}});
      }
    }
  }
  doc.sections.push({title:"Moisture Content Detail",tables:det2.length?det2:[{head:["Visit"],body:[],empty:"No moisture points recorded."}],
    note:"Green is at or below dry goal, red is above. * reading changed after it was first entered."});
  return doc;
}
function atmoChartData(job,m){
  const series=m.locs.filter(l=>l.type!=="hvac").map(l=>({label:locLabel(job,l),type:l.type,vals:m.aDates.map(d=>atmoCalc(job,l.id,d).gpp)})).filter(s=>s.vals.some(isNum));
  return {x:m.aDates.map(d=>`${m.vnum[d]} (${fmtDate(d)})`),series};
}
const CHART_COLORS=["#2f6db5","#d9822b","#3a9b5c","#c0392b","#7d55c7","#16a2b8","#8c6d1f","#d35fa0","#5f6b7a","#1f3b73"];
function chartSvg(ch){
  if(!ch.series.length) return "";
  const W=760,H=240,L=44,R=12,T=12,B=34;
  const all=ch.series.flatMap(s=>s.vals.filter(isNum)); let max=Math.max(...all), min=Math.min(...all,0);
  max=Math.ceil((max+5)/10)*10; min=Math.floor(min/10)*10;
  const n=ch.x.length, xs=i=>L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1)), ys=v=>T+(H-T-B)*(1-(v-min)/(max-min||1));
  let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;font:11px sans-serif">`;
  for(let v=min;v<=max;v+=10){g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="#e3e7ec"/><text x="${L-6}" y="${ys(v)+4}" text-anchor="end" fill="#555">${v}</text>`}
  ch.x.forEach((x,i)=>{g+=`<text x="${xs(i)}" y="${H-B+16}" text-anchor="middle" fill="#555">${esc(x)}</text>`});
  g+=`<text x="12" y="${T+(H-T-B)/2}" transform="rotate(-90 12 ${T+(H-T-B)/2})" text-anchor="middle" fill="#555">GPP</text>`;
  ch.series.forEach((s,k)=>{const c=CHART_COLORS[k%CHART_COLORS.length];const pts=s.vals.map((v,i)=>isNum(v)?`${xs(i)},${ys(v)}`:null);
    let path="",pen=false; pts.forEach(p=>{if(p){path+=(pen?"L":"M")+p;pen=true}else pen=false});
    g+=`<path d="${path}" fill="none" stroke="${c}" stroke-width="2" ${s.type==="dehu"?'stroke-dasharray="5 3"':""}/>`;
    pts.forEach(p=>{if(p){const [x,y]=p.split(",");g+=`<rect x="${x-3}" y="${y-3}" width="6" height="6" fill="#fff" stroke="${c}" stroke-width="1.5"/>`}});
  });
  g+=`</svg><div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;margin-top:4px">${ch.series.map((s,k)=>`<span><span style="display:inline-block;width:14px;height:3px;background:${CHART_COLORS[k%CHART_COLORS.length]};vertical-align:middle;margin-right:4px"></span>${esc(s.label)}</span>`).join("")}</div>`;
  return g;
}
function reportHtml(job){
  const r=reportDoc(job);
  const td=(c,tag="td")=>{ if(c==null||typeof c!=="object") c={t:c==null?"":String(c)};
    const st=c.bg==="dry"?"background:#c6f08a":c.bg==="wet"?"background:#f8c9c9":c.bg==="group"?"background:#6a8faf;color:#fff;font-weight:700;text-align:left":"";
    return `<${tag}${c.span?` colspan="${c.span}"`:""} style="${st}${c.b?";font-weight:700":""}">${esc(c.t).replace(/\n/g,"<br>")}</${tag}>`};
  let h=`<div class="rh"><div class="rh-l"><img src="${LOGO}" alt="weDRY" style="width:150px;max-width:100%"><div style="font-size:9px;color:#666">Prepared with ${APP}</div></div><div class="rh-c"><div class="rt">Water Mitigation Report</div>${esc(COMPANY.name)}<br>${esc(COMPANY.addr1)}<br>${esc(COMPANY.addr2)}<br>${esc(COMPANY.phone)}</div><div class="rh-l"></div></div>`;
  h+=`<div class="info">${r.info.map(b=>`<div><div class="it">${b.title}</div>${b.rows.map(([k,v])=>`<div class="ir"><b>${k}:</b><span>${String(v||"").split("\n").map((t,i)=>i?`<br><i>${esc(t)}</i>`:esc(t)).join("")}</span></div>`).join("")}</div>`).join("")}</div>`;
  const sec=(s)=>{
    let x=`<div class="sec"><div class="st">${s.title}</div>`;
    for(const t of s.tables){
      if(t.title) x+=`<div class="pt2">${esc(t.title)}</div>`;
      x+=`<table><thead><tr>${t.head.map(c=>td(c,"th")).join("")}</tr></thead><tbody>`;
      if(!t.body.length) x+=`<tr><td colspan="${t.head.length}" style="text-align:left">${t.empty||""}</td></tr>`;
      t.body.forEach((row,i)=>{x+=`<tr${t.seps&&t.seps[i]&&i>0?' class="sep"':""}>${row.map(c=>td(c)).join("")}</tr>`});
      x+=`</tbody></table>`;
    }
    if(s.note) x+=`<div class="rn">${s.note}</div>`;
    return x+`</div>`;
  };
  const secs=r.sections;
  h+=secs.slice(0,4).map(sec).join("");
  h+=`<div class="sec"><div class="st">Atmospheric Readings Summary</div>${r.chart.series.length?chartSvg(r.chart):`<div style="padding:6px">No atmospheric readings recorded.</div>`}</div>`;
  h+=secs.slice(4).map(sec).join("");
  if(job.notes) h+=`<div class="sec"><div class="st">Notes</div><div style="white-space:pre-wrap;padding:6px">${esc(job.notes)}</div></div>`;
  h+=`<div class="sig"><div>Technician signature</div><div>Date</div></div><div class="sig"><div>Printed name</div><div>IICRC cert. #</div></div>`;
  return h;
}

function buildPdf(job){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"pt",format:"letter"});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=30;
  const r=reportDoc(job);
  const STEEL=[106,143,175], CYAN=[221,243,247], TITLE=[47,94,150], DRY=[198,240,138], WET=[248,201,201], ALT=[230,230,230];
  // header
  try{doc.addImage(LOGO,"PNG",M,M+4,122,30)}catch(e){}
  doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(110);doc.text("Prepared with "+APP,M,M+46);
  doc.setTextColor(...TITLE);doc.setFont("times","bold");doc.setFontSize(18);doc.text("Water Mitigation Report",W/2,M+12,{align:"center"});
  doc.setTextColor(0);doc.setFont("times","normal");doc.setFontSize(9);
  [COMPANY.name,COMPANY.addr1,COMPANY.addr2,COMPANY.phone].forEach((t,i)=>doc.text(t,W/2,M+26+i*11,{align:"center"}));
  // info columns
  let y=M+80; const colW=(W-2*M)/3; let maxY=y;
  r.info.forEach((b,ci)=>{
    const x=M+ci*colW; let yy=y;
    doc.setFont("times","bold");doc.setFontSize(10.5);doc.setTextColor(...TITLE);doc.text(b.title,x,yy);yy+=14;doc.setTextColor(0);
    for(const [k,v] of b.rows){
      doc.setFont("times","bold");doc.setFontSize(8.5);doc.text(k+":",x,yy);
      doc.setFont("times","normal");
      const parts=String(v||"").split("\n"); const lines=doc.splitTextToSize(parts[0]||"",colW-92);
      doc.text(lines,x+86,yy); yy+=lines.length*10;
      if(parts[1]){doc.setFont("times","italic");doc.setTextColor(...TITLE);const l2=doc.splitTextToSize(parts[1],colW-92);doc.text(l2,x+86,yy);yy+=l2.length*10;doc.setTextColor(0)}
      yy+=2;
    }
    maxY=Math.max(maxY,yy);
  });
  y=maxY+8;
  const secTitle=(title)=>{
    if(y>H-90){doc.addPage();y=M}
    doc.setFillColor(...CYAN);doc.setDrawColor(0);doc.setLineWidth(.6);doc.rect(M,y,W-2*M,18,"FD");
    doc.setFont("times","bold");doc.setFontSize(10.5);doc.setTextColor(0);doc.text(title,M+6,y+12.5);y+=18;
  };
  const fill=c=>c==="dry"?DRY:c==="wet"?WET:c==="group"?STEEL:null;
  const toCell=c=>{ if(c==null||typeof c!=="object") return {content:c==null?"":String(c)};
    const o={content:c.t}; o.styles={}; const f=fill(c.bg); if(f) o.styles.fillColor=f; if(c.bg==="group"){o.styles.textColor=255;o.styles.fontStyle="bold";o.styles.fontSize=9} if(c.b) o.styles.fontStyle="bold"; if(c.span) o.colSpan=c.span; return o};
  const table=(t)=>{
    if(t.title){ if(y>H-80){doc.addPage();y=M} doc.setFillColor(...STEEL);doc.rect(M,y,W-2*M,15,"F");doc.setTextColor(255);doc.setFont("times","bold");doc.setFontSize(9);doc.text(doc.splitTextToSize(t.title,W-2*M-10)[0],M+5,y+10.5);doc.setTextColor(0);y+=15 }
    const body=t.body.length?t.body.map(row=>row.map(toCell)):[[{content:t.empty||"",colSpan:t.head.length,styles:{halign:"left"}}]];
    const cs={}; for(const k in (t.widths||{})) cs[k]={cellWidth:t.widths[k]};
    doc.autoTable({startY:y,head:[t.head],body,theme:"grid",margin:{left:M,right:M},
      styles:{font:"times",fontSize:8,cellPadding:2.5,lineColor:[150,150,150],lineWidth:.4,textColor:0,valign:"middle"},
      headStyles:{fillColor:STEEL,textColor:255,fontStyle:"bold",fontSize:8.5},
      alternateRowStyles:{fillColor:ALT},columnStyles:cs,
      didDrawCell:(dt)=>{ if(t.seps&&dt.section==="body"&&dt.column.index===0&&t.seps[dt.row.index]&&dt.row.index>0){doc.setDrawColor(0);doc.setLineWidth(1.6);doc.line(M,dt.cell.y,W-M,dt.cell.y);doc.setLineWidth(.4)} }
    });
    y=doc.lastAutoTable.finalY;
  };
  const note=(s)=>{ if(!s.note) return; doc.setFont("times","italic");doc.setFontSize(7.5);doc.setTextColor(70);const l=doc.splitTextToSize(s.note,W-2*M);if(y+l.length*9+6>H-40){doc.addPage();y=M}doc.text(l,M,y+9);y+=l.length*9+4;doc.setTextColor(0)};
  const drawSection=(s)=>{ secTitle(s.title); for(const t of s.tables) table(t); note(s); y+=10 };
  r.sections.slice(0,4).forEach(drawSection);
  // chart
  secTitle("Atmospheric Readings Summary");
  if(r.chart.series.length){
    const ch=r.chart, cw=W-2*M, chH=190; if(y+chH+40>H-40){doc.addPage();y=M;secTitle("Atmospheric Readings Summary")}
    doc.setDrawColor(0);doc.setLineWidth(.6);doc.rect(M,y,cw,chH+40);
    const L=M+36,R=M+cw-12,T=y+12,B=y+chH-14;
    const all=ch.series.flatMap(s=>s.vals.filter(isNum)); let max=Math.ceil((Math.max(...all)+5)/10)*10, min=Math.floor(Math.min(...all,0)/10)*10;
    const n=ch.x.length, xs=i=>L+(n===1?(R-L)/2:i*(R-L)/(n-1)), ys=v=>T+(B-T)*(1-(v-min)/(max-min||1));
    doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(80);
    for(let v=min;v<=max;v+=10){doc.setDrawColor(225);doc.setLineWidth(.4);doc.line(L,ys(v),R,ys(v));doc.text(String(v),L-4,ys(v)+2.5,{align:"right"})}
    ch.x.forEach((x,i)=>doc.text(x,xs(i),B+11,{align:"center"}));
    doc.text("GPP",M+8,(T+B)/2,{angle:90});
    ch.series.forEach((s,k)=>{
      const hex=CHART_COLORS[k%CHART_COLORS.length]; const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
      doc.setDrawColor(...rgb);doc.setLineWidth(1.4);
      if(s.type==="dehu") doc.setLineDashPattern([4,2],0);
      let prev=null; s.vals.forEach((v,i)=>{ if(!isNum(v)){prev=null;return} const p=[xs(i),ys(v)]; if(prev) doc.line(prev[0],prev[1],p[0],p[1]); prev=p });
      doc.setLineDashPattern([],0);
      s.vals.forEach((v,i)=>{ if(isNum(v)){doc.setFillColor(255);doc.rect(xs(i)-2.5,ys(v)-2.5,5,5,"FD")} });
    });
    // legend
    let lx=M+10, ly=y+chH+6; doc.setFontSize(7.5);doc.setTextColor(0);
    ch.series.forEach((s,k)=>{const hex=CHART_COLORS[k%CHART_COLORS.length];const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));const w=doc.getTextWidth(s.label)+30; if(lx+w>M+cw-6){lx=M+10;ly+=11} doc.setDrawColor(...rgb);doc.setLineWidth(2);doc.line(lx,ly,lx+14,ly);doc.text(s.label,lx+18,ly+2.5);lx+=w});
    y+=chH+40+10;
  } else { doc.setFont("times","normal");doc.setFontSize(9);doc.text("No atmospheric readings recorded.",M+6,y+12);y+=24 }
  r.sections.slice(4).forEach(drawSection);
  if(job.notes){ secTitle("Notes"); doc.setFont("times","normal");doc.setFontSize(9); const l=doc.splitTextToSize(job.notes,W-2*M-12); if(y+l.length*11>H-40){doc.addPage();y=M} doc.text(l,M+6,y+12); y+=l.length*11+16 }
  if(y>H-120){doc.addPage();y=M}
  y+=46; doc.setDrawColor(0);doc.setLineWidth(.7);doc.setFont("times","normal");doc.setFontSize(8.5);
  const sig=(x,w,label,yy)=>{doc.line(x,yy,x+w,yy);doc.text(label,x,yy+10)};
  sig(M,320,"Technician signature",y); sig(M+360,190,"Date",y);
  sig(M,320,"Printed name",y+40); sig(M+360,190,"IICRC cert. #",y+40);
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(110);
    doc.text(`${job.customer||""}${job.claim?"  |  Claim "+job.claim:""}`,M,H-16);
    doc.text(`${APP}  |  Page ${i} of ${n}`,W-M,H-16,{align:"right"});doc.setTextColor(0)}
  return doc;
}

/* ---------- tech, backup, modal ---------- */
function backupMenu(){
  modal(`<h2>Backup</h2><p class="small muted">Download every job as a file you can keep, or restore jobs from a backup file. Restoring keeps the newer copy of each job.</p>
    <div class="row"><button class="btn" id="m_exp">Download backup</button><label class="btn sec" style="display:inline-block">Restore from file<input type="file" id="m_imp" accept=".json,application/json" style="display:none"></label><span class="grow"></span><button class="btn sec" onclick="closeModal()">Close</button></div>`);
  $("#m_exp").onclick=()=>{const data=JSON.stringify({app:APP,exported:new Date().toISOString(),jobs:state.jobs},null,1);saveFile(`WedryTrack_backup_${today()}.json`,new Blob([data],{type:"application/json"}))};
  $("#m_imp").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const d=JSON.parse(await f.text()); const jobs=d.jobs||{}; let n=0;
      for(const id in jobs){const j=jobs[id]; if(!j||!j.id||!Array.isArray(j.rooms)) continue; const cur=state.jobs[j.id]; if(!cur||(j.updatedAt||0)>(cur.updatedAt||0)){state.jobs[j.id]=normalizeJob(j); if(!state.dirty.includes(j.id))state.dirty.push(j.id); n++}}
      saveLocal(); Sync.schedule(300); closeModal(); render(); toast(`Restored ${n} job${n===1?"":"s"}`);
    }catch(err){toast("That file is not a WedryTrack backup")}
  };
}
function modal(html){ $("#modal").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ $("#modal").innerHTML=""; if(ui.pendingRender){ui.pendingRender=false;render()} }
function confirmBox(msg,onYes){
  modal(`<h2>Are you sure?</h2><p>${msg}</p><div class="row"><span class="grow"></span><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn danger" id="m_yes">Delete</button></div>`);
  $("#m_yes").onclick=()=>{closeModal();onYes()};
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").innerHTML)closeModal()});
